<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Página no encontrada — Sakura Enterprise</title>
  <style>
    :root {
      --bg: #0A050D;
      --surface: #150B1C;
      --accent: #FFB3D9;
      --accent-strong: #FF6FB0;
      --text: #FCEFF5;
      --text-muted: #B8A6C2;
      --line: rgba(255, 179, 217, 0.2);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 111, 176, 0.12), transparent 34rem),
        var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }
    main {
      width: min(100%, 520px);
      padding: 40px 28px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, var(--surface), rgba(21, 11, 28, 0.5));
      clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
    }
    img { width: 96px; height: auto; margin: 0 auto 20px; }
    p { color: var(--text-muted); line-height: 1.7; }
    .code {
      margin: 0 0 8px;
      color: var(--accent-strong);
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.2rem, 5vw, 1.6rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      padding: 12px 20px;
      border-radius: 10px;
      background: var(--accent-strong);
      color: #1A0A14;
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-decoration: none;
      text-transform: uppercase;
    }
    a:hover { background: var(--accent); }
  </style>
</head>
<body>
  <main>
    <img src="/la-base/sakura-enterprise/assets/logo-icon.png" alt="Sakura Enterprise">
    <p class="code">Error 404</p>
    <h1>Esta página no existe</h1>
    <p>Puede que el enlace haya cambiado o que la página todavía no esté publicada.</p>
    <a href="/la-base/sakura-enterprise/">Volver al inicio</a>
  </main>
</body>
</html>
